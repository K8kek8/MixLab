name: Compilar APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: MixLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
